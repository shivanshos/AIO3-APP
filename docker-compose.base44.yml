name: aio3-app

services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_local_password
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # One-shot: applies schema + seed, then exits.
  migrate:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/db:/db:ro
    environment:
      PGPASSWORD: app_local_password
    entrypoint:
      - sh
      - -ec
      - |
        psql -h db -U app -d app -v ON_ERROR_STOP=1 -f /db/schema.sql
        psql -h db -U app -d app -v ON_ERROR_STOP=1 -f /db/seed.sql

  api:
    image: node:22-alpine
    restart: on-failure
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgres://app:app_local_password@db:5432/app
      PORT: "8000"
      BASE44_PREVIEW_MODE:
    command:
      - sh
      - -ec
      - CI=true npm ci --no-audit --no-fund && exec npm run dev
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  web:
    image: node:22-alpine
    restart: on-failure
    working_dir: /app
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      API_PROXY_TARGET: http://api:8000
      BASE44_PREVIEW_MODE:
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:
    command:
      - sh
      - -ec
      - CI=true npm ci --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 5173
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  pgdata:
  backend_node_modules:
  frontend_node_modules:
